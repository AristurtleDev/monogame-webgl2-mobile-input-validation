<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonoGame.Web Mobile Input Validation</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./host.css">
</head>

<body>
    <main id="validation-page">
        <main id="monogame-host"
              data-application-name="MonoGame.Web Mobile Input Validation"
              data-canvas-id="canvas"
              data-content-base-uri="./"
              data-status-id="monogame-host-status"
              data-runtime-script-uri=""
              data-host-exports-type-name=""
              data-main-assembly-name="">
            <canvas id="canvas"
                    width="960"
                    height="540"
                    aria-label="MonoGame mobile input validation canvas"></canvas>
            <p id="monogame-host-status"
               class="host-status"
               hidden
               role="alert"></p>
        </main>

        <label for="accelerometer-permission-diagnostic">Motion permission diagnostic</label>
        <textarea id="accelerometer-permission-diagnostic"
                  hidden
                  readonly
                  rows="5"></textarea>
    </main>

    <noscript>
        <p class="noscript-banner">MonoGame.Web requires JavaScript.</p>
    </noscript>

    <script type="module"
            src="./main.js"></script>
</body>

</html>
